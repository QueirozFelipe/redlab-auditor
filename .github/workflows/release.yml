name: Build and Release RedLab Native

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.os == 'ubuntu-latest' && 'quay.io/quarkus/ubi-quarkus-mandrel-builder-image:jdk-21' || '' }}
      options: --user root

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up GraalVM (Non-Linux)
        if: matrix.os != 'ubuntu-latest'
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'false'

      - name: Install Windows Dependencies
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Run Tests
        run: ./mvnw test

      - name: Inject Secret
        run: echo "app.secret=${{ secrets.REDLAB_SECRET }}" >> src/main/resources/application.properties
        shell: bash

      - name: Build Native Binary
        run: ./mvnw package -Pnative -DskipTests

      - name: Prepare Artifacts for Distribution
        shell: bash
        run: |
          mkdir -p dist
          cp docs/README_DIST.txt dist/README.txt
          
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/*.exe dist/redlab.exe
            cp scripts/install.ps1 dist/
            cd dist && zip ../redlab-windows.zip redlab.exe install.ps1 README.txt
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            cp target/redlab-auditor-*-runner dist/redlab
            cp scripts/install.sh dist/
            cd dist && tar -czvf ../redlab-macos.tar.gz redlab install.sh README.txt
          else
            cp target/redlab-auditor-*-runner dist/redlab
            cp scripts/install.sh dist/
            cd dist && tar -czvf ../redlab-linux.tar.gz redlab install.sh README.txt
          fi

      - name: Upload Intermediate Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.os }}
          path: redlab-*.*

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-bins
          pattern: bin-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            all-bins/redlab-windows.zip
            all-bins/redlab-macos.tar.gz
            all-bins/redlab-linux.tar.gz
          body: "Official native binaries for RedLab Auditor ${{ github.ref_name }}. Includes installation scripts for each OS."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}